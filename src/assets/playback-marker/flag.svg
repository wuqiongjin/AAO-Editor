<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="120" height="130">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="flagGradient" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#55eedc" />
      <stop offset="100%" stop-color="#b8f797" />
    </linearGradient>
  </defs>

  <g filter="url(#neonGlow)" stroke="#38efcf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="#38efcf" opacity="0.8">
    <line x1="32" y1="18" x2="32" y2="105" />
    <path d="M 32 18 L 88 50 L 32 78 Z" />
  </g>

  <g>
    <line x1="32" y1="18" x2="32" y2="105" stroke="#e0ffff" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 32 18 L 88 50 L 32 78 Z"
      fill="url(#flagGradient)"
      stroke="#ebffff"
      stroke-width="2.5"
      stroke-linejoin="round" />
    <text x="46" y="50"
      fill="#2d5b54"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-size="24"
      font-weight="bold"
      text-anchor="middle"
      dominant-baseline="central">J</text>
  </g>
</svg>
