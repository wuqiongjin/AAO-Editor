# 发版 workflow：v* tag push / 手动 dispatch → 三平台矩阵构建 → 发布正式 Release。
# 上游：CNB 主仓打 tag 并过门禁后，由 .cnb.yml 镜像到本仓（非 force），tag push 触发本 workflow。
# 口径：docs/adr/0022-发布链路拓扑.md；实现票：.scratch/release-pipeline/issues/07
#
# 触发只有两种（分支 push / PR 不监听——PR 门禁在 ci.yml，镜像 push 不触发任何 workflow）。
# tag 路径自带 gate job：tag 规则保留管理员直推的灵活性（ADR-0022 §9，用户 2026-10-20 拍板 B），
# 直推的 tag 没过 CNB 门禁——由本 job 三件套兜底后才允许构建发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布 / 补发的 tag（须已存在，且与 package.json version 一致，如 v0.1.0）'
        required: true

permissions:
  contents: write # electron-builder 发布 release 与 gh 补 notes 用

jobs:
  # 门禁 + tag 校验：构建矩阵之前，在 ubuntu 单平台跑一遍与 CNB 同款的三件套。
  # 为什么发版路径也有门禁：tag 规则保留「镜像 PAT + 仓库管理员」均可建 tag（用户 2026-10-20
  # 拍板 B：直推灵活性要保留）——直推的 tag 没过 CNB 门禁，若此处不兜底，一个跑不过门禁的
  # 版本会直接发成正式 Release（latest*.yml 随包，updater 立即可见，撤不回）。
  # 代价（用户拍板接受）：常态发版（CNB 打 tag → 镜像）门禁跑两次——CNB 一次 + 这里一次；
  # 换的是「发布物必然过门禁」+「应急能直推」。手动 dispatch 同样过本 job。
  # tag 与 package.json version 必须一致（npm version 手动管理，不一致即失败）。
  # 手动 dispatch 时构建的是 inputs.tag 指向的代码，不是页面选的分支。
  gate:
    permissions:
      contents: read # 本 job 只读；发布写权限在 build / notes（workflow 级 contents: write）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: 校验 tag ↔ version
        env:
          TAG_INPUT: ${{ github.event.inputs.tag || '' }}
        run: |
          TAG="${TAG_INPUT:-$GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag 与 package.json version 不一致"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 与 CNB 门禁 job、PR 门禁（ci.yml）同一脚本：npm ci → 取素材 → npm test → build → assets:check。
      # tag push / 手动 dispatch 不是 fork PR，ASSETS_SOURCE 正常注入。
      - name: 门禁三件套（ci-gate.sh）
        env:
          ASSETS_SOURCE: ${{ secrets.ASSETS_SOURCE }}
        run: bash scripts/ci/ci-gate.sh

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # electron 二进制跨 run 缓存（各平台路径不同，按 OS 分开 key）
      - name: 缓存 electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 安装依赖
        run: npm ci
      # 素材由 CI 构建期注入（release-pipeline/01）：外部快照仓，凭据走 secret，地址不写明文。
      # 一个 secret 到位：ASSETS_SOURCE = 完整带只读令牌的素材源 git 地址。
      - name: 取素材
        env:
          ASSETS_SOURCE: ${{ secrets.ASSETS_SOURCE }}
        run: bash scripts/ci/ci-assets.sh
      # 门禁三件套已在 gate job（ubuntu 单平台）跑过；矩阵各平台只装依赖 + 取素材 + 构建，不重复全量测试。
      # macos-latest 为 arm64 runner，dmg 出 x64 + arm64 双架构（electron-builder 交叉构建）。
      - name: 构建并发布正式 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build -- --publish=always

  # 三平台都发布完后跑一次：把「未签名告知」与版本发行说明（根目录 RELEASE_NOTES.md）写进 release notes。
  # electron-builder 的 GitHub 发布器建 release 时不写 body（payload 只有 tag/name/draft/prerelease）；
  # 版本描述的单一来源就是仓库根的 RELEASE_NOTES.md（package.json build.releaseInfo.releaseNotesFile
  # 指定，electron-builder 读它写进 latest.yml 的 releaseNotes）——它同时进产品内的「重启更新」弹窗
  # （ADR-0021 §2），页面与产品内是同一份文本。文件在根目录是 issue 04 锁测禁根 build 夹之故。
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: 补未签名告知 + 发行说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTICE='> ⚠️ 安装包暂未做代码签名：macOS 首次打开请右键（或按住 Ctrl 点按）选「打开」；Windows 若弹出 SmartScreen 提示，点「仍要运行」即可。 / Installers are not code-signed yet: on macOS right-click (or Ctrl-click) and choose "Open" the first time; on Windows choose "Run anyway" if SmartScreen appears.'
          NOTES=""
          if [ -f RELEASE_NOTES.md ]; then NOTES="$(cat RELEASE_NOTES.md)"; fi
          { printf '%s\n' "$NOTICE"; if [ -n "$NOTES" ]; then printf '\n---\n\n%s\n' "$NOTES"; fi; } > notes.md
          gh release edit "$TAG" --notes-file notes.md
